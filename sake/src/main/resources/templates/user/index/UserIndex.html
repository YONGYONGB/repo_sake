<!DOCTYPE html>
<html lang="kor" xmlns:th="http://www.thymeleaf.org">

	<div th:replace = "~{user/include/header :: header}"></div>
	<!-- Shop Cart -->

	
	<main>
		<div class="container row" style="margin: 0 96px; padding: 0px; display: flex; gap: 16px; flex-wrap: nowrap;">
			<div class="col-5 sm-12" style="flex: 2; padding: 80px 0 0 0;">
				<h1 style="display: inline; font-size: 48px;">사케.</h1>
				<div style="display: inline; font-size: 48px; color:#9ad1ea;">삶에 부드러움을 더하는</div>
				<div style=" font-size: 48px; color:#9ad1ea;">지혜</div>
			</div>
			<div class="col-7 sm-12" style="flex: 1; padding: 0px 45px 0 0;">
				<img src="/user/template/assets/images/products/Designer (1).jpeg" class="image">
			</div>
		</div>
		<!-- Category Section Start-->
		<section class="mb-lg-10 mt-lg-14 my-8" style="margin-bottom: 16px !important;">
			<div class="container">
				<div class="category-slider">
					<div class="item" th:each ="item:${items}">
						<a th:href="@{/user/product/sakeProduct(pd_id=${item.pd_id})}" class="text-decoration-none text-inherit">
							<div class="card card-product mb-lg-4">
								<div class="card-body text-center py-8" style= "border: 0px">
									<img th:src="@{${item.path}}"
										alt="Grocery Ecommerce Template" class="mb-3 item-img" />
									<div class="text-truncate" th:text="${item.name}">제품이름</div>
								</div>
							</div>
						</a>
					</div>
				</div>
			</div>
		</section>
		<!-- Category Section End-->
		<section>
			<div>

			</div>
			<div class="container">
				<div class="row" style="margin-bottom: 20px;">
					<div class="col">
						<h3 class="mb-0">할인 이벤트(개발중)</h3>
					</div>
				</div>
				<div class="row">
					<div class="col-12 col-md-6 mb-3 mb-lg-0">
						<div data-trigger-click="click [data-relatedlink=':re:_link']">
							<div class="py-10 px-8 rounded"
								style="background: url(/user/template/assets/images/banner/discount_banner1.jpg) no-repeat; background-size: cover; background-position: center">
								<a href="#" data-relatedlink="re_link"></a>
								<div>
									<h3 class="fw-bold mb-1" style="color: white;">사케 할인</h3>
									<p class="mb-4" style="color: white;">
										<span class="fw-bold"> 최대 30%</span>									
									</p>
								</div>
							</div>
						</div>
					</div>
					<div class="col-12 col-md-6 mb-3 mb-lg-0">
						<div data-trigger-click="click [data-relatedlink=':re:_link']">
							<div class="py-10 px-8 rounded"
								style="background: url(/user/template/assets/images/banner/discount_banner3.jpg) no-repeat; background-size: cover; background-position: center">
								<a href="#" data-relatedlink="re_link"></a>
								<div>
									<h3 class="fw-bold mb-1" style="color: white;">어디 브랜드 사케 할인</h3>
									<p class="mb-4" style="color: white;">
									
										<span class="fw-bold"> 최대 25%</span>
									
									</p>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
		<!-- Popular Products Start-->
		<section class="my-lg-14 my-8">
			<div class="container">
				<div class="row">
					<div class="col-12 mb-6">
						<h3 class="mb-0">인기 상품(개발중)</h3>
					</div>
				</div>

				<div class="row g-4 row-cols-lg-5 row-cols-2 row-cols-md-3">
					<div class="col">
						<div class="card card-product">
							<div class="card-body">
								<div class="text-center position-relative">
									<div class="position-absolute top-0 start-0">
										<span class="badge bg-danger">Sale</span>
									</div>
									<a href="./pages/shop-single.html"><img src="/user/template/assets/images/sake/chugoku_2/yamaguchi/dassi/dassai.jpg"
											alt="Grocery Ecommerce Template" class="mb-3 img-fluid" /></a>

								
								</div>
								<div class="text-small mb-1">
									<a href="./pages/shop-single.html" class="text-decoration-none text-muted"><small>준마이다이긴죠슈</small></a>
								</div>
								<div class="text-small mb-1">
									<a href="#!" class="text-decoration-none text-muted"><small>주고쿠</small></a>
									<a href="#!" class="text-decoration-none text-muted"><small>야마구치현</small></a>
									<a href="#!" class="text-decoration-none text-muted"><small>닷사이</small></a>
								</div>
								<h2 class="fs-6"><a href="./pages/shop-single.html"
										class="text-inherit text-decoration-none">닷사이23</a></h2>
								<div>
									<small class="text-warning">
										<i class="bi bi-star-fill"></i>
										<i class="bi bi-star-fill"></i>
										<i class="bi bi-star-fill"></i>
										<i class="bi bi-star-fill"></i>
										<i class="bi bi-star-half"></i>
									</small>
									<span class="text-muted small">4.5(149)</span>
								</div>
								<div class="d-flex justify-content-between align-items-center mt-3">
									<div>
										<span class="text-dark">¥9,100</span>
										<span class="text-decoration-line-through text-muted">¥9,500</span>
									</div>
									<div>
										<a href="./pages/shop-single.html" class="btn btn-primary btn-sm">
											<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
												viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
												stroke-linecap="round" stroke-linejoin="round"
												class="feather feather-plus">
												<line x1="12" y1="5" x2="12" y2="19"></line>
												<line x1="5" y1="12" x2="19" y2="12"></line>
											</svg>
											Add
										</a>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
		<!-- Popular Products End-->
		<section>
			
		</section>
		
	</main>


	<!-- footer -->
	<div th:replace = "~{user/include/footer :: footer}"></div>
</body>

</html>
