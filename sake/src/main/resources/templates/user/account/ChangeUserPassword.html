<!DOCTYPE html>
<html lang="kor" xmlns:th="http://www.thymeleaf.org">
<!-- <div th:replace = "~{user/include/header :: header}"></div> -->
<div th:replace= "~{user/include/accountHeader::header}"></div>
	<main>
    <!-- section -->
    <section class="my-lg-14 my-8">
      <!-- container -->
      <div class="container">
        <!-- row -->
        <div class="row justify-content-center align-items-center">
          <!-- <div class="col-12 col-md-6 col-lg-4 order-lg-1 order-2"> -->
            <!-- img -->
            <!-- <img src="../assets/images/svg-graphics/fp-g.svg" alt="" class="img-fluid" />
          </div> -->
          <div class="col-12 col-md-6 offset-lg-1 col-lg-4 order-lg-2 order-1 d-flex align-items-center" style="margin-left: 0px;">
            <div>
              <div class="mb-lg-9 mb-5" style="text-align: center;">
                <!-- heading -->
                <h1 class="mb-2 h2 fw-bold" >비밀번호 재설정</h1>
                <p>계정과 연결된 이메일을 입력해주세요. 비밀번호 재설정을 위한 이메일을 보내드리겠습니다.</p>
              </div>
              <!-- form -->
              <form class="needs-validation" novalidate>
                <!-- row -->
                <div class="row g-3">
                  <!-- col -->
                  <div class="col-12">
                    <!-- input -->
                    <label for="formForgetEmail" class="form-label visually-hidden">Email address</label>
                    <input type="email" class="form-control" id="formForgetEmail" placeholder="Email" required />
                    <div class="invalid-feedback">Please enter correct password.</div>
                  </div>

                  <!-- btn -->
                  <div class="col-12 d-grid gap-2">
                    <button type="submit" class="btn btn-primary">비밀번호 재설정</button>
                    <a href="signup.html" class="btn btn-light">뒤로가기</a>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
	
	<div th:replace ="~{user/include/footer :: footer}"></div>
</body>

</html>
