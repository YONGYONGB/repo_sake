<!DOCTYPE html>
<html lang="kor" xmlns:th="http://www.thymeleaf.org">
<div th:replace = "~{user/include/header :: header}"></div> 
	<main>
		<!-- section -->
		<section>
			<div class="container">
				<!-- row -->
				<div class="row">
					<!-- col -->
					<div class="col-12">
						<div class="d-flex justify-content-between align-items-center d-md-none py-4">
							<!-- heading -->
							<h3 class="fs-5 mb-0">Account Setting</h3>
							<!-- button -->
							<button class="btn btn-outline-gray-400 text-muted d-md-none btn-icon btn-sm ms-3"
								type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasAccount"
								aria-controls="offcanvasAccount">
								<i class="bi bi-text-indent-left fs-3"></i>
							</button>
						</div>
					</div>
					<!-- col -->
					<div class="col-lg-3 col-md-4 col-12 border-end d-none d-md-block">
						<div class="pt-10 pe-lg-10">
							<!-- nav -->
							<div th:replace = "~{user/include/accountUl :: accountUl }"></div>
						</div>
					</div>
					<div class="col-lg-9 col-md-8 col-12">
						<!-- <div class="py-6 p-md-6 p-lg-10"> -->
							<!-- heading -->
							<h2 class="mb-6">주문 내역</h2>

							<div class="table-responsive-xxl border-0">
								<!-- Table -->
								<table class="table mb-0 text-nowrap table-centered">
									<!-- Table Head -->
									<thead class="bg-light">
										<tr style="text-align: center;">
											<th>&nbsp;</th>
											<th>상품</th>
											<th>주문</th>
											<th>날짜</th>
											<th>갯수</th>
											<th>Status(상태)</th>
											<th>가격</th>
											<!-- <th>cancel</th> -->
										</tr>
									</thead>
									<tbody th:each = "list: ${lists}">
										<!-- Table body -->
										<tr style="text-align: center; align-content: center;">
											<td class="align-middle border-top-0 w-0">
												<a th:href="@{/user/product/sakeProduct(pd_id=${list.pd_id})}" th:value="${list.pd_id}"><img th:if="${list != null}" th:src="@{${list.path}}" 
														alt="Ecommerce" class="icon-shape icon-xl" /></a>
											</td>
											<td class="align-middle border-top-0">
												<a th:href="@{/user/product/sakeProduct(pd_id=${list.pd_id})}" th:value="${list.pd_id}" class="fw-semibold text-inherit">
													<h6 class="mb-0" th:text="${list.name}">닷사이23</h6>
												</a>
											</td>
											<td class="align-middle border-top-0" th:text="${list.op_id}">주문</td>
											<td class="align-middle border-top-0" th:text="${list.od_date}">March 5, 2023</td>
											<td class="align-middle border-top-0" th:text="${list.product_quantity}">갯수</td>
											<td class="align-middle border-top-0">
												<span class="badge bg-warning">Processing</span>
											</td>
											<td class="align-middle border-top-0" th:text="${list.sum}">가격</td>
											<!-- <td class="align-middle border-top-0">
												<button class="btn btn-primary" type="button">
													결제취소
												</button>
											</td> -->
										</tr>
									</tbody>
								</table>
							</div>
						</div>
					</div>
				<!-- </div> -->
			</div>
		</section>
	</main>

	<div th:replace ="~{user/include/footer :: footer}"></div>

</body>

</html>
