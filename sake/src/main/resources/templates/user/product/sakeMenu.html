<!-- pdlist 로드 -->

<script type="text/javascript">
document.addEventListener("DOMContentLoaded", function(){
	checkpd();
})

function checkpd(){
	const seq = document.getElementById("seq").value;
	const thisPage = document.getElementById("thisPage").value;
	
	fetch(`/user/product/filter?thisPage=${thisPage}&seq=${seq}`)
    .then(res => res.text())
    .then(html => {
        document.getElementById("pdList").innerHTML = html;
        document.getElementById("thisPage").value = thisPage; 
    })
    .catch(error => console.error("리뷰 로딩 실패: ", error));
}

</script>

	function goList(thisPage) {
    var localDetail = $('.nav-link.active[data-type="local_detail"]').data('value') || null;
    var selectedType = $('input[data-type="type"]:checked').data('value') || null;
    var shValue = $('#shValue').val() || '';
    var minPrice = $("#priceRange").slider("values", 0);
    var maxPrice = $("#priceRange").slider("values", 1);
    var seq = $('#seq').val() || null;

    $.ajax({
        url: '/user/product/addfilter',
        method: 'GET',
        data: {
            local_detail: localDetail,
            type: selectedType,
            shValue: shValue,
            thisPage: thisPage,
            minPrice: minPrice,
            maxPrice: maxPrice,
            seq: seq
        },
        success: function(response){
        	 // 서버가 응답한 HTML, JSON, 텍스트 등이 이 변수 response에 들어있음
            $('#pdList').html(response);  // 응답 내용을 특정 div에 넣음
            $('#thisPage').val(thisPage); // hidden input도 갱신 (필요하면)
        },
        error: function(){
            alert('상품 리스트 로딩 실패');
        }
    });
}
		
	</script>


<script>
let lastCheckedRadio = null;

$('input[data-type="type"]').on('click', function() {
    if (this === lastCheckedRadio) {
        // 이미 선택된 항목 다시 누르면 해제
        this.checked = false;
        lastCheckedRadio = null;
    } else {
        lastCheckedRadio = this;
    }
    applyFilterFromUI(1);
});



$(function(){
    let typingTimer; // 입력 중 타이머 변수 선언 (연속 입력 방지용 디바운스)

    $('#shValue').on('keyup', function(e){ // 검색어 입력 시 (keyup 이벤트 발생 시)
        e.preventDefault(); // 기본 동작 방지 (안전용)
        clearTimeout(typingTimer); // 이전 타이머 초기화
        typingTimer = setTimeout(function(){
            applyFilterFromUI(1); // 입력이 끝났다고 판단되면 필터 적용
        }, 500); // 0.5초 지연
    });

    $('.nav-link[data-type="local_detail"]').on('click', function(e){  // 지역 상세 필터 (local_detail) 클릭 시
        e.preventDefault(); 	// 기본 링크 이동 방지
        $('.nav-link[data-type="local_detail"]').removeClass('active'); 
        $(this).addClass('active'); // 클릭한 버튼만 active 설정
        applyFilterFromUI(1);  // 필터 적용
    });
    
    if ($('input[data-type="type"]').length === 0) {
    	  console.log("필터 UI가 없습니다.");
    	  // 필터 초기화 혹은 기본값 처리
    	  selectedType = "";
    	  applyFilterFromUI(1);
    	} else {
    	  selectedType = $('input[data-type="type"]:checked').data('value') || null;
    	/*   applyFilterFromUI(1); */
    	}

    $("#priceRange").slider({ // 가격 범위 슬라이더 설정 , jQuery UI 위젯(슬라이더, 드래그, 다이얼로그 등)의 이벤트 핸들러들은보통 event와 ui 두 개의 인자를 받음.
        range: true,
        min: 0,
        max: 100000,
        values: [1000, 30000],
        change: function(event, ui) { //ui는 해당 위젯과 관련된 부가 정보
            $("#priceRange-value").text(ui.values[0].toLocaleString() + " - " + ui.values[1].toLocaleString()); //ui.values → [최솟값, 최댓값]
            applyFilterFromUI(1);
        }
    });
    $("#priceRange-value").text(
        $("#priceRange").slider("values", 0).toLocaleString() + " - " +
        $("#priceRange").slider("values", 1).toLocaleString()
    );
});

function applyFilterFromUI(thisPage) {
	
    var localDetail = $('.nav-link.active[data-type="local_detail"]').data('value') || null;
    var selectedType = $('input[data-type="type"]:checked').data('value') || null;
    var shValue = $('#shValue').val() || '';
    var minPrice = $("#priceRange").slider("values", 0);
    var maxPrice = $("#priceRange").slider("values", 1);
    var seq = $('#seq').val() || null;
    
    if (selectedType === null) {
    	  console.log("선택된 타입이 없어서 기본값 처리합니다.");
    	  // 예) 서버에 빈 문자열 보내기
    	  selectedType = "";
    	}

    $.ajax({
        url: '/user/product/addfilter',
        method: 'GET',
        data: {
            local_detail: localDetail,
            type: selectedType,
            shValue: shValue,
            thisPage: thisPage,
            minPrice: minPrice,
            maxPrice: maxPrice,
            seq: seq
        },
        success: function(response){
            $('#pdList').html(response);
        },
        error: function(){
            alert('필터 적용 실패');
        }
    });
}
</script>



<!-- 가격 -->
<script>
  $(function () {
    $("#priceRange").slider({
      range: true,
      min: 0,
      max: 100000,
      values: [0, 50000],
      slide: function (event, ui) {
        $("#priceRange-value").text(ui.values[0] + "¥ - " + ui.values[1] + "¥");
      }
    });
    $("#priceRange-value").text($("#priceRange").slider("values", 0) +
      "원 - " + $("#priceRange").slider("values", 1) + "¥");
  });
</script>
