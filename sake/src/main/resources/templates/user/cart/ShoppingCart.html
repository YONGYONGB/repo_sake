<script>
document.addEventListener('DOMContentLoaded', function () {
  initializeQuantityControls();
  updatePrices(); // 최초 로드 시 가격 계산
});

// 메인 함수: 수량 조작 이벤트 등록 및 가격 업데이트
function initializeQuantityControls() {
  // + / - 버튼 이벤트
  document.querySelectorAll('.button-plus, .button-minus').forEach(function (btn) {
    btn.addEventListener('click', function (event) {
      event.preventDefault();
      event.stopPropagation();

      const input = this.closest('.input-spinner').querySelector('.quantity-field');
      const currentVal = parseInt(input.value);
      const action = this.dataset.action;
      const productId = input.dataset.productId;
      const maxQuantity = parseInt(input.dataset.maxQuantity);

      let totalForProduct = getTotalQuantityForProduct(productId);
      let newVal = currentVal;

      if (action === 'plus') {
        if (totalForProduct < maxQuantity) {
          newVal = Math.min(currentVal + 1, maxQuantity);
        } else {
          return;
        }
      } else if (action === 'minus') {
        newVal = Math.max(currentVal - 1, parseInt(input.min) || 1);
      }

      input.value = newVal;
      input.dispatchEvent(new Event('input')); // 가격 반영
    });
  });

  // 수량 직접 입력 이벤트
  document.querySelectorAll('.quantity-field').forEach(function (input) {
    input.addEventListener('input', function () {
      const quantity = parseInt(this.value);
      const pricePerUnit = parseInt(this.dataset.price);
      const priceSpan = this.closest('.row').querySelector('.price');

      if (!isNaN(quantity) && priceSpan) {
        priceSpan.textContent = '¥' + (quantity * pricePerUnit).toLocaleString();
      }

      updatePrices();
    });
  });
}

// 제품별 총 수량 계산 (같은 productId를 모두 합산)
function getTotalQuantityForProduct(productId) {
  let total = 0;
  document.querySelectorAll('.quantity-field').forEach(function (input) {
    if (input.dataset.productId === productId) {
      total += parseInt(input.value);
    }
  });
  return total;
}
// 총 금액 업데이트
function updatePrices() {
  let totalPrice = 0;

  document.querySelectorAll('.quantity-field').forEach(function (input) {
    const quantity = parseInt(input.value);
    const pricePerUnit = parseInt(input.dataset.price);
    if (!isNaN(quantity) && !isNaN(pricePerUnit)) {
      totalPrice += quantity * pricePerUnit;
    }
  });

  const pdPriceElement = document.querySelector('#pd-price');
  const saleElement = document.querySelector('#pd-sale');
  const allPriceElement = document.querySelector('.all-price');

  if (pdPriceElement) pdPriceElement.textContent = '¥' + totalPrice.toLocaleString();

  // 할인 금액이 있는 경우 적용
  let sale = 0;
  if (saleElement) {
    sale = parseFloat(saleElement.textContent.replace('¥', '').replace(',', '')) || 0;
  }

  const finalPrice = totalPrice - sale;
  if (allPriceElement) {
    allPriceElement.textContent = '¥' + finalPrice.toLocaleString();
  }
}
</script>

	<!--db 자동 삭제 이벤트 보여주기  -->
	<script>
	document.querySelectorAll('.countdown').forEach(el => {
		  const cartTime = new Date(el.textContent.replace(' ', 'T')); // 안정적인 포맷

		  const expirationTime = cartTime.getTime() + (48 * 60 * 60 * 1000);

		  function updateCountdown() {
		    const now = new Date();
		    const timeLeft = expirationTime - now;

		    if (timeLeft <= 0) {
		      el.innerText = '시간 종료';
		    } else {
		      const hours = Math.floor(timeLeft / (1000 * 60 * 60));
		      const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
		      const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
		      el.innerText = `${hours}시간 ${minutes}분 ${seconds}초 뒤 삭제`;
		    }
		  }

		  // 처음 실행하고 1초마다 업데이트
		  updateCountdown();
		  setInterval(updateCountdown, 1000);
		});
	</script>

      async function requestPayment() {
  		const totalPriceElement = document.querySelector('.all-price');

 		let totalPrice = 0;

		}

 		// 서버로부터 orderId 받아오기
