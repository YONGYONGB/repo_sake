<!DOCTYPE html>
<html lang="kor" xmlns:th="http://www.thymeleaf.org">


 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

<div th:replace = "~{xdm/include/form_head :: head}"></div>

  <main id="main" class="main">
  <div>
    <div class = "col cen">  <!-- 중앙 부분  기본정보-->
      <div class = "row a name">
        <div>
          <nav style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
              <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="#">Page1</a></li>
                <li class="breadcrumb-item"><a href="#">Page2</a></li>
                <li class="breadcrumb-item active" aria-current="page">Default</li>
              </ol>
          </nav>
          <label for="exampleFormControlInput1" class="form-label par"><strong>Discount</strong></label> 
        </div>
      </div> <!-- 공통복사 부분 end-->

      <div class = "row a centerh">
        <div class = "wrap">
          <div class = "row userbox">
            <div class = "col-12">
              <p>기본정보</p>
            </div>
          </div>
        </div>
        <div class = "wrap2">
          <form method="post" id="form" class="row needs-validation" novalidate>  
            <div class = "row">
              <input type="hidden" name="dc_id" th:value="${vo.dc_id}">
              <div class="col-3"><label for="dc_id" class="form-label">코드</label> 
                <input type="text" class="form-control" id="dc_id" name ="dc_id" th:value="${item?.dc_id}" disabled>
              </div>
              <div class="col-3"><label for="discount_name" class="form-label">할인이벤트&nbsp;이름</label><span style="color: crimson;">*</span> 
                <input type="text" class="form-control" id="discount_name" th:value="${item?.discount_name}" placeholder="한글, 영어대소문자, 숫자" name="discount_name" required>
                <div class="invalid-feedback" id="discount_nameError"></div>
              </div>
              <div class="col-3"><label for="discount_rate" class="form-label">할인률</label> <span style="color: crimson;">*</span>
                <input type="text" class="form-control" id="discount_rate" name="discount_rate" th:value="${item?.discount_rate}" placeholder="할인률을 넣어주세요.">
                <div class="invalid-feedback" id="discount_rateError"></div>
              </div>
              <div class = "col-3"><label for="dc_use" class="form-label" >사용여부</label><span style="color: crimson;">*</span>
                <select class="form-select" aria-label="Default select example" id="dc_use" name="dc_use" required>
                  <option selected value="">선택하세요</option>
                   <option value="1" th:selected="${item?.dc_use == 1}">사용</option>
                   <option value="0" th:selected="${item?.dc_use == 0}">미사용</option>
                </select><div class="invalid-feedback" id="dc_useError">
                   선택을해주세요.
                  </div>               
              </div>
            </div>
          
            <div class = "row">
              <div class = "col-3"><label for="discount_dateS" class="form-label" >할인시작일</label><span style="color: crimson;">*</span> 
                <input type="text"  class="form-control" id="discount_dateS" name="discount_dateS" th:value="${item?.discount_dateS}" required>
                <div class="invalid-feedback" id="discount_dateSError">
                  Please select a valid state.
                </div>
              </div>   
              <div class = "col-3"><label for="discount_dateF" class="form-label" >할인마감일</label><span style="color: crimson;">*</span> 
                <input type="text"  class="form-control" id="discount_dateF" name="discount_dateF" th:value="${item?.discount_dateF}" required>
                <div class="invalid-feedback" id="discount_dateFError">
                  Please select a valid state.
                </div>
              </div>   
            </div>
            <div class = "row"><div class = "col-6 "></div></div>
            <div class = "row"><div class = "col-6 "></div></div>
            <div class = "row"><div class = "col-6 "></div></div>
            
            <div class = "row rowbotton">
              <div class="col-1">
                <div class ="justify-content-start" style="display: flex;">
                  <button type="button" class="btn btn-outline-dark" style=" border: 0.1px solid;"><i class="bi bi-list-task"></i></button>
                </div>
              </div>
              <div class ="col-10"></div>
              <div class="col-1 ">
                <div class ="justify-content-end" style="display: flex;">
                  <button class="btn btn-primary" type="button" id="dc_submit"><i class="bi bi-server"></i></button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div> 
    </div>
  </div>	


  </main><!-- End #main -->
  
  
 

 <div th:replace = "~{/xdm/include/footer::footer}"></div>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
 
    
<script type="text/javascript">
jQuery('#discount_dateS').datetimepicker({
	format:'Y.m.d H:i',
	lang:'ko'
});
jQuery('#discount_dateF').datetimepicker({
	format:'Y.m.d H:i',
	  lang:'ko'
});

</script>
 
 
 <script type="text/javascript">
 
 let seq = document.querySelector("input[name=dc_id]");		
 document.getElementById("dc_submit").onclick = function () {
	 
		event.preventDefault();
	 	
	 	document.getElementById("discount_name").classList.remove("is-invalid");
		document.getElementById("discount_name").classList.remove("is-valid");
	    document.getElementById("dc_use").classList.remove("is-invalid");
	    document.getElementById("dc_use").classList.remove("is-valid");
	    document.getElementById("discount_rate").classList.remove("is-invalid")
	    document.getElementById("discount_rate").classList.remove("is-valid")
	    document.getElementById("discount_dateS").classList.remove("is-valid")
	    document.getElementById("discount_dateS").classList.remove("is-valid")
	    document.getElementById("discount_dateF").classList.remove("is-valid")
	    document.getElementById("discount_dateF").classList.remove("is-valid")
		
		document.getElementById("dc_useError").textContent = '';
 		document.getElementById("discount_nameError").textContent = '';
		document.getElementById("discount_rateError").textContent = '';
		document.getElementById("discount_dateSError").textContent = '';
		document.getElementById("discount_dateFError").textContent = '';
     	      
		let isValid = true; 
	    
	    
		const name = document.getElementById("discount_name").value;
		if(name == null || name == "" || name.trim() != name){
			document.getElementById("discount_nameError").textContent = "코드그룹 이름에 대한 값을 입력해주세요";
			document.getElementById("discount_name").classList.add("is-invalid");
			isValid = false;
		}else{
			document.getElementById("discount_name").classList.add("is-valid");
		}
		
		const use = document.getElementById("dc_use").value;  
		if(use == null || use == ""){
			document.getElementById("dc_useError").textContent = "사용여부에 대한 값을 입력해주세요";
			document.getElementById("dc_use").classList.add("is-invalid");
			isValid = false;
		}else{
			document.getElementById("dc_use").classList.add("is-valid");
		}
		
		const start = document.getElementById("discount_dateS").value;  
		if(start == null || start == ""){
			document.getElementById("discount_dateSError").textContent = "날짜를 입력해주세요";
			document.getElementById("discount_dateS").classList.add("is-invalid");
			isValid = false;
		}else{
			document.getElementById("discount_dateS").classList.add("is-valid");
		}
		
		const end = document.getElementById("discount_dateF").value;   /* s 보다 뒷날짜 설정하도록 해야함. */
		if(end == null || end == ""){
			document.getElementById("discount_dateFError").textContent = "날짜를 입력해주세요";
			document.getElementById("discount_dateF").classList.add("is-invalid");
			isValid = false;
		}else{
			document.getElementById("dc_use").classList.add("is-valid");
		}
		
	    const order = document.getElementById("discount_rate").value;    /* 0이 안나오도록 설정하도록 해야함. */
	 	let regex = /^[0-9]+$/;
		 if(order == null || order == ""){
			document.getElementById("discount_rateError").textContent = "순서에 대한 값을 입력해주세요";
			document.getElementById("discount_rate").classList.add("is-invalid");
			isValid = false;
		}else if(!regex.test(order)){
			document.getElementById("discount_rateError").textContent = " 0 이상의 숫자를 입력해주세요";
			document.getElementById("discount_rate").classList.add("is-invalid");
			isValid = false;
		}else{
			document.getElementById("discount_rate").classList.add("is-valid");
		}
		 
		if(isValid){
			console.log("폼 제출"); 
			document.getElementById("form").submit();
		}else {
         console.log("유효성 검사 실패: 폼 제출 안 함");
     	}
	 
	 
	 	if(isValid){
			console.log("폼 제출"); 
			if(seq.value == "0" || seq.value == "") {
				/* if(validationInst() == false) return false; */
				form.action = "/xdm/discount/DiscountXdmInsert";
				form.submit();
			} else {
				/* if(validationUpdt() == false) return false; */
				form.action = "/xdm/discount/DiscountXdmUpdate";
				form.submit();
			}
		}else {
         console.log("유효성 검사 실패: 폼 제출 안 함");
     }
	 
	}
 </script>
    
    
    
    
    
   </body>
</html>
