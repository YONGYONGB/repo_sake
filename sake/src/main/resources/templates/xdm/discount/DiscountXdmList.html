<!DOCTYPE html>
<html lang="kor" xmlns:th="http://www.thymeleaf.org">

	<div th:replace = "~{xdm/include/background :: head}"></div>

  <main id="main" class="main" style=" padding: 0px;">
   <form name="formList" id="formList" method="post" autocomplete="off">
		<input type="hidden" name="thisPage" th:value="${vo.thisPage}" default="1"/>
		<input type="hidden" id="rowNumToShow" name="rowNumToShow" th:value="${vo.rowNumToShow}"/>
		<input type="hidden" name="dc_id">
          <div id="divSearch" class = "col cen">  <!-- 중앙 부분  기본정보-->
            <div class = "a">
              <div>
                <nav style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
                    <ol class="breadcrumb">
                      <li class="breadcrumb-item"><a href="#">Page1</a></li>
                      <li class="breadcrumb-item"><a href="#">Page2</a></li>
                      <li class="breadcrumb-item active" aria-current="page">Default</li>
                    </ol>
                </nav>
                <label for="exampleFormControlInput1" class="form-label par"><strong>Discount</strong></label> 
              </div>
            </div>
            <div class = "row-1 firstbody">
                <div class = "col-2 fbele"><select id="shDelNy" name="shDelNy" class="form-select" aria-label="Default select example">
                    <option value="" th:selected="${vo.shDelNy == null}">삭제여부</option>
                    <option value="1" th:selected="${vo.shDelNy == 1}">Y</option>
                    <option value="0" th:selected="${vo.shDelNy == 0}">N</option>
                  </select></div>
                <div class = "col-2 fbele"><select name="shUseNy" id="shUseNy" class="form-select" aria-label="Default select example">
                    <option value="" th:selected="${vo.shUseNy == null}">사용 여부</option>
                    <option value="1" th:selected="${vo.shUseNy == 1}">Y</option>
                    <option value="0" th:selected="${vo.shUseNy == 0}">N</option>
                  </select></div>
                <div class = "col-2 fbele"><select id="shOptionDate" name="shOptionDate" class="form-select" aria-label="Default select example">
                    <option value="" th:selected="${vo.shOptionDate == null}">날짜</option>
                    <option value="1" th:selected="${vo.shOptionDate == 1}">등록일</option>
					<option value="2" th:selected="${vo.shOptionDate == 2}">수정일</option>
                  </select></div>
                <div class = "col-2 fbele"><input type="text" id="shDateStart" name="shDateStart" placeholder="시작일" th:value="${vo.shDateStart}" class="form-control form-control-sm" >
                 
                </div>
                <div class = "col-2 fbele"><input type="text" id="shDateEnd" name="shDateEnd" placeholder="종료일"  th:value="${vo.shDateEnd}" class="form-control form-control-sm">

                </div>
            </div>
            <div class = "row-1 firstbody">
                <div class = "col-2  fbele ">
                	<select id="shOption" name="shOption" class="form-select" aria-label="Default select example">
                    	<option value="" th:selected="${vo.shOption == null}">검색구분</option>
						<option value="1" th:selected="${vo.shOption == 1}">코드그룹 코드</option>
						<option value="2" th:selected="${vo.shOption == 2}">코드그룹 이름</option>
						<option value="3" th:selected="${vo.shOption == 3}">코드 이름</option>
                 	</select>
                 </div>
                <div class = "col-2 fbele"><input type="text" id="shValue" name="shValue" th:value="${vo.shValue}" onkeyup="enterkey()" placeholder="검색어" class="form-control form-control-sm"></div>
                <div class="col-2 fbele invalid-feedback" id="shValueFeedback"></div>
                <div class = "col-2 fbele bu"><button id="btnSearch" type="button" class="btn btn-outline-dark" title="Search"><i class="bi bi-search"></i></button>
                  <button type="button"  id="btnReset" class="btn btn-outline-dark"><i class="bi bi-arrow-clockwise"></i></button>
                </div>
            </div>
            <div class=" row bb ">
              <div class = "row cent justify-content-center;">
                <div class ="col-3"><h6 th:text="'총 갯수: ' + ${vo.totalRows}"></h6></div>
                <div class ="col-3"></div>
                <div class ="col-3"></div>
                <div class ="datatable-dropdown col-3" style="display: flex; justify-content: end;">
                  <label>
                    <select class ="datatable-selector" name="rowNumToShow"  onchange="goView(this.value)">
                      <option th:selected="${vo.rowNumToShow} == 5 ">5</option>
                      <option th:selected="${vo.rowNumToShow}== 10 ">10</option>
                      <option th:selected="${vo.rowNumToShow} == 15">15</option>
                    </select> 
                  </label>
                </div>
                <table class="table datatable" style=" text-align: center">   
                  <thead>              
                    <tr>
                      <th style="text-align: center;"><input class="form-check-input" type="checkbox" value="" id="flexCheckDefault"></th>
                      <th style="text-align: center;">#</th>
                      <th style="text-align: center;">코드</th>
                      <th style="text-align: center;">코드사용여부</th>
                      <th style="text-align: center;">할인이벤트 이름</th>
                      <th style="text-align: center;">할인률</th>
                      <th style="text-align: center;">할인 시작일</th>
                      <th style="text-align: center;">할인 종료일</th>
                    </tr>
                  </thead>
                  <tbody>
                  	<tr th:if="${#lists.isEmpty(list)}" class="hover-actions-trigger btn-reveal-trigger position-static">
                  		<td colspan = "10">
                  			<p class = "fs-0" >there are no date!</p>
                  		</td>
                  	</tr>
                  	<tr th:if="${!#lists.isEmpty(list)}" th:each = "list:${list}">
                      <td><input class="form-check-input" type="checkbox" value="" id="flexCheckDefault"></td>
                      <td th:text="${vo.totalRows - ((vo.thisPage - 1) * vo.rowNumToShow + listStat.index)}"></td> <!--디버깅 테스트를 위해서-->
                      <td th:text ="${list.dc_id}"></td>
                      <td th:text ="${list.dc_use == 1? '사용':'미사용'}"></td>
                      <td><a href="javascript:void(0);" th:text="${list.discount_name}" th:attr="onclick=|goForm('${list.dc_id}')|"></a></td>
                      <td th:text = "${list.discount_rate}"></td>
                      <td th:text = "${list.discount_dateS}"></td>
                      <td th:text = "${list.discount_dateF}"></td>
                    </tr>
                  </tbody>
                </table> 
              </div>
              
              <nav class ="datatable-pagination"  style="display: flex; justify-content: center;">
              	<ul class ="datatable-pagination-list">
              		<li th:if="${vo.startPage gt vo.pageNumToShow}" class="page-item" style="cursor: pointer;">
						<a class="page-link" href="javascript:goList(${vo.startPage - 1})" th:attr="onclick=|goList('${vo.startPage - 1}')|">    
					<i class="fa-solid fa-angle-left"></i>
					</a>
					</li>
					<li th:each="num: ${#numbers.sequence(vo.startPage, vo.endPage)}" th:classappend="${num eq vo.thisPage} ? active : ''" class="page-item" style="cursor: pointer;">
						<a class="page-link" th:attr="onclick=|goList('${num}')|" th:text="${num}"><!-- ${i.index} --></a>
					</li>
					<li th:if="${vo.endPage ne vo.totalPages}" class="page-item" style="cursor: pointer;">
					<a class="page-link" th:attr="onclick=|goList('${vo.endPage + 1}')|">
						<i class="fa-solid fa-angle-right"></i>
					</a>
					</li>
              	</ul>
              </nav>
              
              
              <div class ="row wrapfin">
                <div class = "col-3">
                  <button type="button" class="btn btn-danger">x</button>
                  <button type="button" class="btn btn-danger"><i class="bi bi-trash"></i></button>
                </div>
                <div class= "col-6"></div>
                <div class = "col-3 fini" style="display: flex; justify-content: end;">
                  <button type="button" class="btn btn-success"><i class="bi bi-file-earmark-excel-fill"></i></button>
                  <button type="button" id="dc_form" class="btn btn-primary"><i class="bi bi-file-earmark-plus-fill"></i></button>
                </div>
              </div>
            </div>  
          </div> <!-- 중앙 부분  기본정보-->
   </form>

  </main><!-- End #main -->
  

  <!-- ======= Footer ======= -->
 	<div th:replace = "~{xdm/include/footer :: footer}"></div>
 	
 	<script type="text/javascript">
		jQuery('#shDateStart').datetimepicker({
			format:'Y.m.d ',
			lang:'ko'
		});
		jQuery('#shDateEnd').datetimepicker({
			format:'Y.m.d',
	  		lang:'ko'
		});
	</script>
	

	
	<script type="text/javascript">
	document.getElementById("btnSearch").onclick = function () {
	    form.action = "/xdm/discount/DiscountXdmList";
	    form.submit();
	};
	
	document.getElementById("btnReset").onclick = function () {
		let shD = document.getElementById("shDelNy");  
		let shU = document.getElementById("shUseNy");  
		let shOD = document.getElementById("shOptionDate");  
		let shO = document.getElementById("shOption");  
		let shDS = document.getElementById("shDateStart");  
		let shE = document.getElementById("shDateEnd");  
		let shV = document.getElementById("shValue");  
		
		shD.value ="0";
		shU.value ="1";
		shOD.value ="";
		shO.value ="";
		shDS.value ="";
		shE.value ="";
		shV.value ="";
		
		form.action = "/xdm/discount/DiscountXdmList";
	    form.submit();
	};
	</script>
 	
 	<!-- =======공통 ======= -->
  	<script type="text/javascript">
  	let seq = document.querySelector("input[name=dc_id]");	
  	</script>
  <!-- ======= 공통끝 ======= -->	
  
  <!-- ======= 등록에 대한 js ======= -->
  	<script type="text/javascript">
  	document.getElementById("dc_form").onclick = function () {
  	    goForm(0);
  	}

  	goForm = function (keyValue) {
  	    seq.value = keyValue;
  	    form.action = "/xdm/discount/DiscountXdmForm";   
  	    form.submit();
  	}
  	</script>
  <!-- ======= 등록에 대한 js 끝======= -->
 	 	
 	
 	 <script type="text/javascript">
		let form = document.querySelector("form[name=formList]");
		goList = function(thisPage) {
		console.log(thisPage);
    	document.querySelector("input[name=thisPage]").value = thisPage;
    	form.submit();
		}
	</script>
	
	<script type="text/javascript">
    function goView(selectedValue) {
        console.log(selectedValue); // 선택한 값 확인
        let form = document.querySelector("form[name=formList]"); // 폼 찾기
        document.querySelector("input[name=rowNumToShow]").value = selectedValue; // 값 설정
        form.action = "/xdm/discount/DiscountXdmList"; // 폼 제출할 URL 설정
        form.submit(); // 폼 제출
    }
	</script>
	

</html>
