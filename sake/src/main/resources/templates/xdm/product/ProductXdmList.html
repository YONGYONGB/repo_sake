  <script type="text/javascript">
  const inputFile = document.getElementById('excelFile');
  const excelUploadBtn = document.getElementById('excel_upload');

  excelUploadBtn.addEventListener('click', function() {
    if (!inputFile.value) {
      alert('파일을 선택해주세요.');
      return;
    }

    // 확장자 검사
    const fileName = inputFile.value;
    const ext = fileName.substring(fileName.lastIndexOf('.') + 1).toLowerCase();
    const allowedExtensions = ['xls', 'xlsx'];

    if (!allowedExtensions.includes(ext)) {
      alert('엑셀 파일만 업로드 가능합니다 (.xls, .xlsx)');
      return;
    }

    // 용량 검사 (5MB 제한)
    const maxSize = 5 * 1024 * 1024;
    if (inputFile.files[0].size > maxSize) {
      alert('파일 크기는 5MB를 초과할 수 없습니다.');
      return;
    }

    // FormData 생성
    const formData = new FormData();
    formData.append('file', inputFile.files[0]);

    // AJAX 요청 (fetch 사용 예)
    fetch('/xdm/product/uploadExcel', {
      method: 'POST',
      body: formData
    })
    .then(response => {
      if (response.ok) {
        alert('업로드 성공!');
        inputFile.value = '';  // 초기화
      } else {
        alert('업로드 실패 : ' + response.statusText);
      }
    })
    .catch(error => {
      alert('업로드 중 오류 발생 : ' + error.message);
    });
  });
  
  </script>

<script type="text/javascript">
  if(document.getElementById("btnUelete")){
		document.getElementById("btnUelete").onclick = function () {
			document.querySelector("#modalConfirmTitle").textContent = "확 인";
			document.querySelector("#modalConfirmBody").textContent = "해당 데이터를 삭제하시겠습니까 ?";
			document.querySelector("#btnModalUelete").style.display = '';
			document.querySelector("#btnModalDelete").style.display = 'none';
			$("#modalConfirm").modal("show");      	
		}
	}

	document.getElementById("btnModalUelete").onclick = function () {
		
		const query = 'input[name="itemCheckbox"]:checked';
		const selectedElements = document.querySelectorAll(query);
		//체크박스 체크된 항목의 개수
		const selectedElementsCnt = selectedElements.length;
		if(selectedElementsCnt == 0){
		      alert("삭제할 항목을 선택해주세요.");
		      return false;
		}else{
			const selectedValues = [];
			selectedElements.forEach(element => {
	            selectedValues.push(element.value);
	        });
			
			seq.value = selectedValues.join(',');
			form.action = "/xdm/product/ProductXdmUelete";
			form.submit();
		}
	}
  </script>
